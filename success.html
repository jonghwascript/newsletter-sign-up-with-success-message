<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="primary--success">
  <main>
    <section class="success">
      <img src="./images/icon-success.svg" alt="" class="check">
      <h1 class="title">Thanks for subscribing!</h1>
      <p class="description">
        A confirmation email has been sent to
        <strong>ash@loremcompany.com</strong>. Please open it and click the button inside to confirm
        your subscription. Dismiss message
      </p>
      <button class="dismiss-btn">Dismiss message</button>
  </main>
</body>

</html>
