<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

  <title>
    Frontend Mentor | Newsletter sign-up form with success message
  </title>

  <link rel="stylesheet" href="./css/style.css" />
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main>
    <section aria-labelledby="newsletter-title">
      <picture>
        <source srcset="./images/illustration-sign-up-tablet.svg" media="(min-width: 768px)" />
        <source srcset="./images/illustration-sign-up-desktop.svg" media="(min-width: 1024px)" />
        <img src="./images/illustration-sign-up-mobile.svg" alt="Stay updated!" class="illustration" />
      </picture>
      <div class="newsletter">
        <h1 id="newsletter-title" class="newsletter-title">Stay updated!</h1>
        <p class="-newsletter-description">
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <ul class="newsletter-benefits">
          <li>Product discovery and building what matters</li>
          <li>Measuring to ensure updates are a success</li>
          <li>And much more!</li>
        </ul>
        <form>
          <div>
            <label>Email address</label>
            <input type="text" name="email" id="" placeholder="email@company.com" />
          </div>
          <button>Subscribe to monthly newsletter</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by
    <a href="https://www.frontendmentor.io/profile/jonghwascript">jonghwascript</a>.
  </footer>
</body>

</html>
